name: Mobile card fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[mobile-card-fix]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Apply mobile product card spacing fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('style.css')
          css = path.read_text(encoding='utf-8')
          marker = '/* MOBILE PRODUCT CARD — title/image separation fix */'

          if marker not in css:
              css += r'''

/* ==========================================================
   MOBILE PRODUCT CARD — title/image separation fix
   ========================================================== */
@media (max-width: 699px) {
  .product-card {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  .product-image-wrap {
    position: relative;
    overflow: hidden;
    flex: 0 0 auto;
  }

  .product-image {
    display: block;
    position: relative;
    z-index: 1;
    max-width: 100%;
  }

  .product-body {
    position: relative;
    z-index: 4;
    flex: 1 1 auto;
    min-width: 0;
    padding: 14px 9px 11px;
    background: var(--white);
  }

  .product-name {
    position: relative;
    z-index: 5;
    margin: 0 0 5px;
    font-size: clamp(19px, 5.2vw, 22px);
    line-height: 1.05;
    overflow-wrap: anywhere;
  }

  .inspired {
    position: relative;
    z-index: 5;
    min-height: 30px;
    margin-bottom: 8px;
    line-height: 1.45;
  }

  .profile-row,
  .price-line,
  .view-details {
    position: relative;
    z-index: 5;
  }
}
'''
              path.write_text(css, encoding='utf-8')
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css .github/workflows/mobile-card-fix.yml
          git commit -m 'Fix mobile product card spacing [mobile-card-fix]' || exit 0
          git rm .github/workflows/mobile-card-fix.yml
          git commit -m 'Remove temporary mobile card fix workflow [mobile-card-fix]'
          git push
