name: Restore product text spacing

on:
  push:
    paths:
      - '.github/workflows/restore-product-text-spacing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Revert last text-position tweak and set balanced spacing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('style.css')
          css = path.read_text()
          old = '''
/* ==========================================================
   MOBILE PRODUCT TEXT — slight separation from image
   ========================================================== */
@media (max-width: 699px) {
  .product-name,
  .inspired {
    position: relative;
    top: 5px;
  }
}
'''
          new = '''
/* ==========================================================
   MOBILE PRODUCT TEXT — balanced separation from image
   ========================================================== */
@media (max-width: 699px) {
  .product-body {
    padding-top: 14px;
  }
}
'''
          if old not in css:
              raise SystemExit('Expected last text-position patch was not found; refusing to modify style.css.')
          path.write_text(css.replace(old, new, 1))
          PY

          rm -f .github/workflows/restore-product-text-spacing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css .github/workflows/restore-product-text-spacing.yml
          git commit -m 'Restore product text and balance image spacing'
          git push origin HEAD:main
