name: Apply mobile image fill patch

on:
  push:
    paths:
      - '.github/workflows/apply-mobile-image-fill.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply CSS patch and clean up
        shell: bash
        run: |
          cat >> style.css <<'EOF'

          /* ==========================================================
             MOBILE PRODUCT IMAGE — edge-to-edge / larger visual
             ========================================================== */
          @media (max-width: 699px) {
            .product-image-wrap {
              min-height: 0;
              height: auto;
              padding: 0;
              aspect-ratio: 1 / 1;
            }

            .product-image {
              width: 100%;
              height: 100%;
              object-fit: contain;
            }

            .product-body {
              padding: 9px 9px 10px;
            }

            .product-gender {
              top: 8px;
              left: 8px;
              z-index: 3;
            }
          }
          EOF

          rm -f .github/workflows/apply-mobile-image-fill.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css .github/workflows/apply-mobile-image-fill.yml
          git commit -m 'Make mobile product images edge-to-edge'
          git push origin HEAD:main
