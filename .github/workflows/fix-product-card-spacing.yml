name: Fix product card spacing

on:
  push:
    paths:
      - '.github/workflows/fix-product-card-spacing.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CSS fix
        run: |
          python -c "from pathlib import Path; import re; p=Path('style.css'); s=p.read_text(); s,n=re.subn(r'\\n/\\* ==========================================================\\n   MOBILE PRODUCT TEXT — slight separation from image\\n   ========================================================== \\*/\\n@media \\(max-width: 699px\\) \\{\\n  \\.product-name,\\n  \\.inspired \\{\\n    position: relative;\\n    top: 5px;\\n  \\}\\n\\}\\n?', '', s, count=1); assert n==1, 'last text-position patch not found'; s += '\\n/* ==========================================================\\n   MOBILE PRODUCT TEXT — balanced separation from image\\n   ========================================================== */\\n@media (max-width: 699px) {\\n  .product-body {\\n    padding-top: 14px;\\n  }\\n}\\n'; p.write_text(s)"
          rm -f .github/workflows/restore-product-text-spacing.yml .github/workflows/fix-product-card-spacing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css .github/workflows/restore-product-text-spacing.yml .github/workflows/fix-product-card-spacing.yml
          git commit -m 'Restore product text and balance image spacing'
          git push origin HEAD:main
